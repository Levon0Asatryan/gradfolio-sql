services:
  mysql:
    image: mysql:8.4
    container_name: gradfolio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gradfolio}
      MYSQL_USER: ${MYSQL_USER:-gradfolio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gradfolio_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Only the schema and the seed, in that order. Mounting all of sql/ ran
      # its files alphabetically -- drop.sql, then queries.sql against tables
      # that did not exist yet (ERROR 1146) -- and the container restarted in
      # a loop on every fresh volume.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: adminer:latest
    container_name: gradfolio-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    name: gradfolio_mysql_data
